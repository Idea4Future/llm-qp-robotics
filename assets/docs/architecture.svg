<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="680" viewBox="0 0 1160 680" role="img" aria-labelledby="title desc">
<title id="title">LLM QP Robotics architecture</title>
<desc id="desc">A local chat command and world registry feed Qwen. A typed compiler validates the objectives and constraints, then a fixed skill executor connects Nav2 global paths, local convex QPs, and the RB-Y1 in Isaac Sim. Simulated observations feed the controller and status returns to the chat interface.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#59756f"/></marker></defs>
<rect width="1160" height="680" rx="22" fill="#f4f7f5"/>
<g font-family="DejaVu Sans,Arial,sans-serif" fill="#173a35">
<text x="42" y="48" font-size="25" font-weight="700">LLM QP Robotics</text><text x="42" y="75" font-size="14" fill="#526b66">Language defines the task. Solvers compute the motion. Simulation executes it.</text>
<g stroke="#ccd9d4" fill="#fff" stroke-width="1.4">
<rect x="42" y="118" width="235" height="132" rx="14"/><rect x="316" y="118" width="235" height="132" rx="14"/>
