<text x="329" y="576" font-size="12" fill="#526b66">Status + observations → UI</text>
<text x="42" y="640" font-size="13" fill="#526b66">Each control step solves a local QP; task selection, contact and the complete robot mission are not one convex problem.</text>
</g></svg>
