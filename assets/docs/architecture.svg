<rect x="590" y="498" width="528" height="104" rx="14" fill="#e9f0ed"/>
</g>
<g font-size="17" font-weight="700">
<text x="62" y="150">Chat UI</text><text x="336" y="150">Local LLM</text><text x="610" y="150">Compiler + validator</text><text x="884" y="150">Skill executor</text>
<text x="62" y="340">World registry</text><text x="336" y="340">Nav2 / ROS 2 Humble</text><text x="610" y="340">Local convex QPs</text><text x="884" y="340">Isaac Sim + Isaac Lab</text><text x="610" y="532">Simulated observations</text>
</g>
<g font-size="14" fill="#3d5852">
<text x="62" y="179">Natural-language command</text><text x="62" y="204">Stages + rendered equations</text><text x="62" y="229">Loopback web interface</text>
<text x="336" y="179">Qwen3-4B / llama.cpp</text><text x="336" y="204">Select object + destination</text><text x="336" y="229">Propose weights + bounds</text>
<text x="610" y="179">Typed schema + known IDs</text><text x="610" y="204">Numeric and semantic checks</text><text x="610" y="229">Expand supported 10 skills</text>
<text x="884" y="179">Navigate → pick → tray</text><text x="884" y="204">Carry → regrasp → place</text><text x="884" y="229">State and completion gates</text>
<text x="62" y="369">Object / shelf / slot IDs</text><text x="62" y="394">Known layout + observations</text>
<text x="336" y="369">NavFn global path</text><text x="336" y="394">Scene-derived static map</text><text x="336" y="419">ComputePathToPose action</text>
<text x="610" y="369">CVXPY + OSQP</text><text x="610" y="394">Arm joint-velocity QP</text><text x="610" y="419">Base velocity QP</text>
<text x="884" y="369">RB-Y1 A v1.2 + gripper</text><text x="884" y="394">Wheel drives + contact grasp</text><text x="884" y="419">CPU PhysX / GPU rendering</text>
<text x="610" y="559">Wrist RGB / ArUco · ideal raycast LiDAR</text><text x="610" y="584">Joint state + ground-truth base pose · contact / support checks</text>
</g>
